name: 'Autoroute'
description: 'Autoroute a given DSN file to SES with FreeRouting'
inputs:
  boards:
    description: 'Specctra SES output file'
    required: true
runs:
  using: 'docker'
  # TODO: May want to use my own dockerfile
  image: 'docker://ceoloide/ergogen-freerouting:latest'
  entrypoint: '/bin/sh'
  args:
    - '-c'
    - |
      for board in ${{ inputs.boards }};
      do
        echo "Processing $board";
        if [ -e ${board}.ses ]; then
          echo "Cleaning up ${board}.ses";
          rm -f ${board}.ses;
        fi
        if [ -e ${board}.dsn ]; then
          echo "Autoroute PCB";
          java -jar /opt/freerouting.jar -de ${board}.dsn -do ${board}.ses -dr ./freerouting/freerouting.rules --user-data-path ./freerouting -mp 25 -mt 1 -dct 0 --gui.enabled=false --profile.email=marco.massarelli@gmail.com
        fi
      done
